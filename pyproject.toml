[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-gate"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2,<3",
    "google-auth-httplib2>=0.2,<1",
    "google-auth-oauthlib>=1.2,<2",
    "mem0ai>=1,<2",
    "openai>=1,<2",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["mypy>=1.13,<2", "pytest>=8.3,<9", "ruff>=0.9,<1", "types-PyYAML>=6,<7"]

[tool.setuptools.packages.find]
include = ["adapters*", "benchmarks*", "connectors*", "demo*", "gate*", "loop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["adapters", "benchmarks", "demo", "gate", "loop"]
